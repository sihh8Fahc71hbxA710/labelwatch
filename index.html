    return best;
  }
  function valuation(day) {
    var list = holdings(day).map(function (h) {
      var avg = h.cost / h.qty, pr = latestPrice(h.pkey, day), price = pr ? pr.price : avg;
      var value = h.qty * price, gain = value - h.cost, tax = (h.acct !== 'nisa' && gain > 0) ? gain * TAX_RATE : 0;
      return Object.assign({}, h, { avg: avg, price: price, priceDate: pr ? pr.date : null, value: value, gain: gain, tax: tax });
    });
    var sum = function (k) { return list.reduce(function (s, h) { return s + h[k]; }, 0); };
    return { list: list, value: sum('value'), gain: sum('gain'), tax: sum('tax'), cost: sum('cost') };
  }
  function saleCalc(h, qty, price, fee) {
    var avg = h.cost / h.qty, cost = avg * qty, proceeds = qty * price, gain = proceeds - fee - cost;
    var tax = (h.acct !== 'nisa' && gain > 0) ? Math.floor(gain * TAX_RATE) : 0;
    return { cost: cost, proceeds: proceeds, gain: gain, tax: tax, net: proceeds - fee - (h.acct === 'tokutei' ? tax : 0), taxDue: h.acct === 'ippan' ? tax : 0 };
  }

  // ----- グラフ -----
  function lineChart(points, label) {
    if (points.length < 2) return '<div class="chart-empty">' + (points.length ? '記録が2日分以上になると、ここに推移の線が出ます。' : 'まだデータがありません。') +
      '<button class="link" data-act="sample">サンプルデータを入れて見てみる</button></div>';
    var W = 340, H = 196, L = 50, R = 14, T = 14, B = 30;
    var x0 = points[0].t, x1 = points[points.length - 1].t;
    var vs = points.map(function (p) { return p.v; }), y0 = Math.min.apply(null, vs), y1 = Math.max.apply(null, vs);
    if (y0 > 0 && y0 > (y1 - y0) * 2) { /* 0から始めないと平らに見えるときはそのまま */ }
    if (y1 === y0) { y0 -= Math.max(1, Math.abs(y0) * 0.1); y1 += Math.max(1, Math.abs(y1) * 0.1); }
    var pad = (y1 - y0) * 0.1; y0 -= pad; y1 += pad;
    var X = function (t) { return L + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - L - R); };
    var Y = function (v) { return T + (1 - (v - y0) / (y1 - y0)) * (H - T - B); };
    var out = '';
    [0.15, 0.5, 0.85].forEach(function (f) {
      var v = y0 + (y1 - y0) * f, y = Y(v).toFixed(1);
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" class="grid"/><text x="' + (L - 6) + '" y="' + y + '" class="axis" text-anchor="end" dominant-baseline="central">' + yenCompact(v) + '</text>';
    });
    if (y0 < 0 && y1 > 0) out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" class="zero"/>';
    var d = 'M' + X(points[0].t).toFixed(1) + ' ' + Y(points[0].v).toFixed(1);
    for (var i = 1; i < points.length; i++) d += 'H' + X(points[i].t).toFixed(1) + 'V' + Y(points[i].v).toFixed(1); // 次の記録までは同じ金額
    out += '<path d="' + d + '" class="series"/>';
    var last = points[points.length - 1];
    out += '<circle cx="' + X(last.t).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) + '" r="4" class="dotp"/>';
    function md(t) { var dd = new Date(t); return (dd.getMonth() + 1) + '/' + dd.getDate(); }
    out += '<text x="' + L + '" y="' + (H - 8) + '" class="axis">' + md(x0) + '</text><text x="' + (W - R) + '" y="' + (H - 8) + '" class="axis" text-anchor="end">' + md(x1) + '</text>';
    out += '<g class="hover" hidden><line class="cross" y1="' + T + '" y2="' + (H - B) + '"/><circle r="5" class="dotp"/></g>';
    var pts = JSON.stringify(points.map(function (p) { return [p.t, Math.round(p.v), +X(p.t).toFixed(1), +Y(p.v).toFixed(1)]; }));
    return '<div class="chart-wrap"><svg class="line-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" data-pts="' + esc(pts) + '" aria-label="' + esc(label + '：' + md(x0) + ' ' + yen(points[0].v) + ' から ' + md(x1) + ' ' + yen(last.v)) + '">' + out + '</svg><div class="chart-tip" hidden></div></div>';
  }
  function chartHover(e) {
    var svg = e.target.closest && e.target.closest('.line-chart'); if (!svg) return;
    var pts = JSON.parse(svg.getAttribute('data-pts') || '[]'); if (!pts.length) return;
    var r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 340;
    var best = pts[0]; pts.forEach(function (p) { if (Math.abs(p[2] - x) < Math.abs(best[2] - x)) best = p; });
    var g = svg.querySelector('.hover'), tip = svg.parentNode.querySelector('.chart-tip');
    g.hidden = false;
    g.querySelector('line').setAttribute('x1', best[2]); g.querySelector('line').setAttribute('x2', best[2]);
    g.querySelector('circle').setAttribute('cx', best[2]); g.querySelector('circle').setAttribute('cy', best[3]);
    var dd = new Date(best[0]);
    tip.hidden = false; tip.textContent = (dd.getMonth() + 1) + '/' + dd.getDate() + '　' + yen(best[1]);
    tip.style.left = Math.min(Math.max(best[2] / 340 * r.width - 50, 0), r.width - 120) + 'px';
  }
  function chartLeave(e) {
    var svg = e.target.closest && e.target.closest('.line-chart'); if (!svg) return;
    svg.querySelector('.hover').hidden = true;
    var tip = svg.parentNode.querySelector('.chart-tip'); if (tip) tip.hidden = true;
  }
  function pieSVG(items, total, label) {
    if (!(total > 0)) return '<svg class="pie-m" viewBox="0 0 240 240" role="img" aria-label="データがありません"><circle cx="120" cy="120" r="114" style="fill:var(--empty)"></circle><text class="empty-text" x="120" y="120" text-anchor="middle" dominant-baseline="central">データなし</text></svg>';
    var cx = 120, cy = 120, r = 114, a0 = -Math.PI / 2, out = '';
    items.forEach(function (it) {
      var f = it.value / total, a1 = a0 + f * Math.PI * 2;
      it.f = f; it.mid = (a0 + a1) / 2;
      if (f >= 0.0005) {
        if (f > 0.9995) out += '<circle class="slice" cx="120" cy="120" r="114" style="fill:var(--c' + it.color + ')"></circle>';
        else {
          var x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
          out += '<path class="slice" style="fill:var(--c' + it.color + ')" d="M120 120L' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A114 114 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + 'Z"></path>';
        }
      }
      a0 = a1;
    });
    items.forEach(function (it) {
      var lines = [];
      if (prefs.showPieNames && it.f >= 0.10) lines.push({ t: it.label, cls: 'nm' });
      if (prefs.showPiePercent && it.f >= 0.07) lines.push({ t: pctText(it.f), cls: '' });
      if (!lines.length) return;
      var lr = it.f > 0.9995 ? 0 : r * 0.62, x = (cx + lr * Math.cos(it.mid)).toFixed(1), y = (cy + lr * Math.sin(it.mid)).toFixed(1);
      var st = 'fill:var(--on-c' + it.color + ')';
      out += lines.length === 1
        ? '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" style="' + st + '"' + (lines[0].cls ? ' class="nm"' : '') + '>' + esc(lines[0].t) + '</text>'
        : '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" style="' + st + '"><tspan class="nm" x="' + x + '" dy="-0.6em">' + esc(lines[0].t) + '</tspan><tspan x="' + x + '" dy="1.25em">' + esc(lines[1].t) + '</tspan></text>';
    });
    return '<svg class="pie-m" viewBox="0 0 240 240" role="img" aria-label="' + esc(label + '：' + items.filter(function (i) { return i.value > 0; }).map(function (i) { return i.label + ' ' + pctText(i.f); }).join('、')) + '">' + out + '</svg>';
  }

  // ----- サンプルデータを入れる（家計簿） -----
  function buildSample() {
    var today = startOfDay(now()), start = startOfMonth(addMonths(today, -3)), seed = 11;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    var m = defaultMoney(), bank = { id: uid(), name: 'みずほ銀行', balance: 800000, rate: 0.2 };
    m.startDate = start; m.cash = 50000; m.banks = [bank];
    var E = m.expenseCats, I = m.incomeCats, n = 0;
    function entry(type, d, amount, cat, acct, memo, to) {
      m.entries.push({ id: uid(), type: type, date: d, amount: Math.round(amount), account: acct, toAccount: to || null, categoryId: cat || null, memo: memo || '', created: d + (n++) });
    }
    for (var d = start; d <= today; d = addDays(d, 1)) {
      var day = new Date(d).getDate();
      if (day === 25) entry('income', d, 250000, I[0].id, bank.id, '給料');
      if (day === 27) entry('expense', d, 82000, E[3].id, bank.id, '家賃');
      if (day === 1 || day === 15) entry('transfer', d, 30000, null, bank.id, '', 'cash');
      if (rnd() < 0.7) entry('expense', d, 400 + rnd() * 1800, E[0].id, 'cash');
      if (rnd() < 0.25) entry('expense', d, 300 + rnd() * 1500, E[1].id, 'cash');
      if (rnd() < 0.3) entry('expense', d, 200 + rnd() * 900, E[2].id, 'cash');
      if (rnd() < 0.08) entry('expense', d, 2000 + rnd() * 6000, E[4].id, 'cash');
      if (rnd() < 0.06) entry('expense', d, 3000 + rnd() * 5000, E[5].id, 'cash');
    }
    [[E[0], 40000], [E[1], 8000], [E[2], 10000], [E[3], 82000], [E[4], 15000]].forEach(function (x) { m.budgets[x[0].id] = x[1]; });
    var keep = money; money = m; // holdings() と saleCalc() をサンプルの上で使う
    function trade(side, d, type, name, code, acct, qty, price, acctPay) {
      var t = { id: uid(), side: side, assetType: type, name: name, code: code, acct: acct, qty: qty, price: price, fee: 0, date: d, account: acctPay, created: d + (n++) };
      if (side === 'sell') {
        var h = holdings(d).filter(function (x) { return x.key === holdKey(t); })[0], c = saleCalc(h, qty, price, 0);
        t.cost = c.cost; t.gain = c.gain; t.tax = c.tax; t.net = c.net; t.taxDue = c.taxDue;
      }
      m.trades.push(t);
    }
    trade('buy', addDays(start, 4), 'stock', 'トヨタ自動車', '7203', 'tokutei', 100, 2500, bank.id);
    trade('buy', addDays(start, 9), 'bond', '個人向け国債', '', 'ippan', 1, 100000, bank.id);
    trade('buy', addDays(start, 36), 'stock', 'トヨタ自動車', '7203', 'tokutei', 100, 3000, bank.id);
    for (var k = 0; k < 4; k++) { var bd = addDays(addMonths(start, k), 2); if (bd <= today) trade('buy', bd, 'fund', '全世界株式ファンド', '', 'nisa', 3, 10000 + k * 400, bank.id); }
    var sd = addDays(start, 66); if (sd <= today) trade('sell', sd, 'stock', 'トヨタ自動車', '7203', 'tokutei', 50, 3500, bank.id);
    money = keep;
    var w = 0;
    for (var pd = addDays(start, 7); pd <= today; pd = addDays(pd, 7), w++) {
      m.prices.push({ id: uid(), key: 'stock|7203', price: Math.round(2500 + w * 60 + (rnd() - 0.5) * 220), date: pd });
      m.prices.push({ id: uid(), key: 'fund|全世界株式ファンド', price: Math.round(10000 + w * 110 + (rnd() - 0.5) * 300), date: pd });
    }
    return m;
  }
  function loadSample() {
    var has = money.entries.length || money.trades.length;
    function apply() { money = buildSample(); saveMoney(); ui.flow = {}; renderAll(); toast('サンプルデータを入れました'); }
    if (!has) { apply(); return; }
    confirmDialog({ title: 'サンプルデータに置き換えますか？', message: '今の家計簿のデータは消えます（時間管理の記録はそのままです）。', ok: '置き換える', destructive: true }).then(function (ok) { if (ok) apply(); });
  }

  function openBaseCF() {
    var draft = { startDate: money.startDate, cash: money.cash, banks: money.banks.map(function (b) { return Object.assign({}, b); }) };
    var wrap = document.createElement('div');
    function used(id) { return money.entries.some(function (e) { return e.account === id || e.toAccount === id; }) || money.trades.some(function (t) { return t.account === id; }); }
    function draw() {
      var sum = draft.cash + draft.banks.reduce(function (s, b) { return s + (Number(b.balance) || 0); }, 0);
      var bal = balances(null);
      wrap.innerHTML =
        '<p class="note">使い始めた日に持っていた現金と預金を入れます。この合計が<strong>基準CF</strong>になり、ここから収入・支出・売買を足し引きして今の保有現金（CF）を計算します。</p>' +
        '<div class="row2"><label class="field"><span>使い始めた日</span><input type="date" data-f="startDate" value="' + ymd(draft.startDate) + '"></label>' +
        '<label class="field"><span>現金（円）</span><input type="text" inputmode="decimal" data-f="cash" value="' + esc(commas(String(draft.cash))) + '"></label></div>' +
        '<h4 class="group">銀行預かり</h4>' +
        (draft.banks.length ? '<div class="bank-head"><span>銀行名</span><span>残高（円）</span><span>年利（%）</span><span></span></div>' : '') +
        draft.banks.map(function (b, i) {
          return '<div class="bank-row" data-i="' + i + '"><input type="text" maxlength="30" data-b="name" value="' + esc(b.name) + '" aria-label="銀行名">' +
            '<input type="text" inputmode="decimal" data-b="balance" value="' + esc(commas(String(b.balance))) + '" aria-label="残高">' +
            '<input type="text" inputmode="decimal" data-b="rate" value="' + esc(String(b.rate)) + '" aria-label="年利">' +
            '<button class="icon-btn" data-delbank="' + i + '" aria-label="' + esc(b.name) + 'を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg></button></div>';
        }).join('') +
        '<button class="btn block" data-act="addbank">＋ 銀行を追加</button>' +
        '<div class="sum-box"><div class="kv strong"><span>基準CF（合計）</span><span id="baseSum">' + yen(sum) + '</span></div></div>' +
        '<h4 class="group">今の残高を合わせる（補正）</h4>' +
        '<p class="note">入力漏れなどで実際の残高と合わないときに使います。実際の金額を入れると、差額を今日の「補正」として記録します（初期基準CFはそのまま）。</p>' +
        '<div class="group-card">' + accounts().map(function (a) {
          return '<div class="switch-row"><span>' + esc(a.name) + '　<b>' + yen(bal.by[a.id] || 0) + '</b></span><button class="link" data-adjust="' + esc(a.id) + '">合わせる</button></div>';
        }).join('') + '</div><p class="err" id="baseErr" role="alert"></p>';
    }
    function recalc() {
      var sum = draft.cash + draft.banks.reduce(function (s, b) { return s + (Number(b.balance) || 0); }, 0);
      var el = $('#baseSum', wrap); if (el) el.textContent = yen(sum);
    }
    wrap.addEventListener('input', function (e) {
      var f = e.target.getAttribute('data-f'), bf = e.target.getAttribute('data-b');
      if (f === 'cash') { var v = parseAmount(e.target.value); draft.cash = isFinite(v) ? v : 0; recalc(); }
      if (f === 'startDate') { var d = parseYMD(e.target.value); if (isFinite(d)) draft.startDate = d; }
      if (bf) {
        var i = Number(e.target.closest('.bank-row').getAttribute('data-i')), b = draft.banks[i];
        if (bf === 'name') b.name = e.target.value;
        else { var n = parseAmount(e.target.value); b[bf] = isFinite(n) ? n : 0; recalc(); }
      }
    });
    wrap.addEventListener('click', function (e) {
      var btn = e.target.closest('button'); if (!btn) return;
      if (btn.getAttribute('data-act') === 'addbank') { draft.banks.push({ id: uid(), name: '銀行' + (draft.banks.length + 1), balance: 0, rate: 0.2 }); draw(); return; }
      if (btn.hasAttribute('data-delbank')) {
        var i = Number(btn.getAttribute('data-delbank')), b = draft.banks[i];
        if (money.banks.some(function (x) { return x.id === b.id; }) && used(b.id)) { $('#baseErr', wrap).textContent = '「' + b.name + '」は記録で使われているので削除できません（名前は変えられます）'; return; }
        draft.banks.splice(i, 1); draw(); return;
      }
      if (btn.hasAttribute('data-adjust')) openAdjust(btn.getAttribute('data-adjust'), function () { draw(); });
    });
    draw();
    openSheet({ title: '初期基準CF', content: wrap, actions: [
      { label: 'キャンセル', onClick: function (close) { close(); } },
      { label: '保存', kind: 'primary', onClick: function (close) {
        money.startDate = startOfDay(draft.startDate);
        money.cash = Math.round(draft.cash);
        money.banks = draft.banks.map(function (b) { return { id: b.id, name: String(b.name).trim().slice(0, 30) || '銀行', balance: Math.round(Number(b.balance) || 0), rate: Math.min(Math.max(Number(b.rate) || 0, 0), 100) }; });
        saveMoney(); close(); renderAll(); toast('初期基準CFを保存しました');
      } }
    ] });
  }
  function openAdjust(acct, after) {
    if (acct !== 'cash' && !money.banks.some(function (b) { return b.id === acct; })) { toast('新しく追加した銀行は、先に保存してから合わせてください'); return; }
    var cur = balances(null).by[acct] || 0;
    var html = '<p class="note">' + esc(accountName(acct)) + 'の計算上の残高は <strong>' + yen(cur) + '</strong> です。実際の金額を入れてください。</p>' +

      } }

  function openMoneyCats(kind) {

        money[key] = money[key].filter(function (c) { return c.id !== del; }); delete money.budgets[del]; saveMoney(); draw();
      }
    });
    draw();
    openSheet({ title: word + 'のカテゴリ', content: wrap, actions: [{ label: '完了', kind: 'primary', onClick: function (close) { close(); } }], onClose: renderAll });
  }

  });
  $('#inputBody').addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'flowAmount' || id === 'flowMemo') {
      var d = flowDraft(ui.moneyMode);
      if (id === 'flowAmount') d.amount = e.target.value; else d.memo = e.target.value;
      updateFlowButton(); return;
    }
    if (/^b(Qty|Price|Fee)$/.test(id)) updateBuySum();
    if (/^s(Qty|Price|Fee)$/.test(id)) updateSellSum();
  });
  $('#inputBody').addEventListener('change', function (e) {
    var id = e.target.id, d = ui.flow[ui.moneyMode];
    if (id === 'flowAmount' && d) { e.target.value = commas(e.target.value); d.amount = e.target.value; }
    if (id === 'flowDate' && d) { var t = parseYMD(e.target.value); if (isFinite(t)) d.date = t; }
    if (id === 'flowAcct' && d) d.account = e.target.value;
    if (id === 'bPay') updateBuySum();
    if (id === 'sHold') { prefillSell(); updateSellSum(); }
    if (/^(bPrice|bFee|sPrice|sFee)$/.test(id)) e.target.value = commas(e.target.value);
  });
  $('#budgetBody').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'bprev') { ui.budgetMonth = addMonths(ui.budgetMonth, -1); renderBudget(); return; }
    if (act === 'bnext') { ui.budgetMonth = addMonths(ui.budgetMonth, 1); renderBudget(); return; }
    if (b.hasAttribute('data-budget')) openBudget(b.getAttribute('data-budget'));
  });
  $('#assetsBody').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-act') === 'unlock') { unlockPaid(); return; }
    if (b.getAttribute('data-act') === 'sample') { loadSample(); return; }
    if (b.hasAttribute('data-aview')) { ui.assetsView = b.getAttribute('data-aview'); renderAssets(); return; }
    if (b.hasAttribute('data-price')) openPrice(b.getAttribute('data-price'), b.getAttribute('data-pname'));
  });
  document.addEventListener('pointermove', chartHover);
  document.addEventListener('pointerdown', chartHover);
  document.addEventListener('pointerout', function (e) { if (e.target.closest && e.target.closest('.line-chart') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.line-chart'))) chartLeave(e); });

  // ===== v1.3：元に戻す（1つ前の状態だけ）・記録のスワイプ削除・カテゴリの並び替え =====
  function updateUndoBtn() {
    var b = document.getElementById('btnUndo');
    if (b) b.disabled = !undoJSON;
  }
  function restoreTime(json) {
    var snap = normalize(JSON.parse(json));
    data = snap; ui.lastStopped = null;
    lastJSON = JSON.stringify(data);
    writeJSON(STORAGE_KEY, data);
    stopTicker(); renderAll(); startTicker();
  }
  function setUndo(json) {
    undoJSON = json || null;
    try { if (undoJSON) localStorage.setItem(UNDO_KEY, undoJSON); else localStorage.removeItem(UNDO_KEY); } catch (e) {}
    updateUndoBtn();
  }
  // 時間管理のデータ（記録・計測中・カテゴリ・タスク・予定）を1つ前に戻す。計測中の経過時間は開始時刻から計算し直す
  function undoLast() {
    if (!undoJSON || ui.app !== 'time') return;
    var before = JSON.stringify(data), snap = undoJSON;
    try { restoreTime(snap); } catch (e) { setUndo(null); toast('元に戻せませんでした'); return; }
    setUndo(null);
    toast('1つ前の状態に戻しました', 'やり直す', function () {
      var cur = JSON.stringify(data);
      try { restoreTime(before); } catch (e) { return; }
      setUndo(cur);
    });
  }

  // ----- 集計の記録：右にスワイプして削除 -----
  function deleteRecord(id) {
    var i = data.sessions.findIndex(function (s) { return s.id === id; }); if (i < 0) return;
    var s = data.sessions[i];
    data.sessions.splice(i, 1); save(); renderAll();
    toast('記録を削除しました', '取り消し', function () {
      if (data.sessions.some(function (x) { return x.id === s.id; })) return;
      data.sessions.push(s); save(); renderAll();
    });
  }
  (function () {
    var list = $('#records'), st = null, suppress = 0;
    list.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('button.rec'); if (!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
      st = { b: b, li: b.parentNode, x: e.clientX, y: e.clientY, dx: 0, on: false, id: e.pointerId };
    });
    list.addEventListener('pointermove', function (e) {
      if (!st || e.pointerId !== st.id) return;
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (!st.on) {
        if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { st = null; return; }
        if (dx > 12 && dx > Math.abs(dy) * 1.5) {
          st.on = true; st.li.classList.add('swiping');
          try { list.setPointerCapture(e.pointerId); } catch (x) {}
        } else return;
      }
      st.dx = Math.max(0, dx);
      st.b.style.transform = 'translateX(' + st.dx + 'px)';
      st.li.classList.toggle('arm', st.dx > st.li.offsetWidth * 0.35);
      e.preventDefault();
    });
    function end(e) {
      if (!st || e.pointerId !== st.id) return;
      var s = st; st = null;
      if (!s.on) return;
      suppress = now();
      if (e.type === 'pointerup' && s.dx > s.li.offsetWidth * 0.35) {
        s.b.style.transition = 'transform 0.18s ease-out';
        s.b.style.transform = 'translateX(105%)';
        setTimeout(function () { deleteRecord(s.b.getAttribute('data-id')); }, 180);
      } else {
        s.b.style.transition = 'transform 0.18s ease-out'; s.b.style.transform = '';
        setTimeout(function () { s.b.style.transition = ''; s.li.classList.remove('swiping', 'arm'); }, 200);
      }
    }
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
    list.addEventListener('click', function (e) { if (now() - suppress < 450) { e.stopPropagation(); e.preventDefault(); } }, true);
  })();

  // ----- カテゴリの編集：長押しして上下に動かすと並び替え -----
  function enableCatReorder(wrap, onDone) {
    var lp = null, drag = null, suppress = 0;
    function cancelLP() { if (lp) { clearTimeout(lp.timer); lp = null; } }
    wrap.addEventListener('pointerdown', function (e) {
      var row = e.target.closest('.cat-row');
      if (!row || e.target.closest('input, [data-del]') || (e.pointerType === 'mouse' && e.button !== 0)) return;
      var item = row.parentNode;
      lp = { item: item, x: e.clientX, y: e.clientY, id: e.pointerId };
      lp.timer = setTimeout(startDrag, 420);
    });
    function startDrag() {
      if (!lp) return;
      var items = $$('.cat-list > div', wrap), idx = items.indexOf(lp.item);
      if (idx < 0) { lp = null; return; }
      var rects = items.map(function (el) { return el.getBoundingClientRect(); });
      var gap = items.length > 1 ? Math.max(0, rects[1].top - rects[0].bottom) : 0;
      drag = { items: items, idx: idx, to: idx, rects: rects, h: rects[idx].height + gap, y0: lp.y, id: lp.id, el: lp.item };
      lp = null;
      drag.el.classList.add('dragging');
      wrap.classList.add('reordering');
      try { wrap.setPointerCapture(drag.id); } catch (x) {}
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (x) {}
    }
    wrap.addEventListener('pointermove', function (e) {
      if (lp && e.pointerId === lp.id) {
        if (Math.abs(e.clientX - lp.x) > 8 || Math.abs(e.clientY - lp.y) > 8) cancelLP();
        return;
      }
      if (!drag || e.pointerId !== drag.id) return;
      e.preventDefault();
      var dy = e.clientY - drag.y0, r0 = drag.rects[drag.idx], cy = r0.top + r0.height / 2 + dy, to = drag.idx;
      drag.rects.forEach(function (r, i) {
        var mid = r.top + r.height / 2, slack = r.height * 0.15; // 隣の行の中ほどを越えたら入れ替える
        if (i < drag.idx && cy < mid + slack) to = Math.min(to, i);
        if (i > drag.idx && cy > mid - slack) to = Math.max(to, i);
      });
      drag.to = to;
      drag.el.style.transform = 'translateY(' + dy + 'px)';
      drag.items.forEach(function (el, i) {
        if (i === drag.idx) return;
        var shift = 0;
        if (to > drag.idx && i > drag.idx && i <= to) shift = -drag.h;
        if (to < drag.idx && i < drag.idx && i >= to) shift = drag.h;
        el.style.transform = shift ? 'translateY(' + shift + 'px)' : '';
      });
    });
    function finish(e) {
      if (lp && e.pointerId === lp.id) cancelLP();
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null; suppress = now();
      wrap.classList.remove('reordering');
      d.el.classList.remove('dragging');
      d.items.forEach(function (el) { el.style.transform = ''; });
      if (d.to !== d.idx) {
        var moved = data.categories.splice(d.idx, 1)[0];
        data.categories.splice(d.to, 0, moved);
        save(); onDone();
        toast('「' + moved.name + '」を' + (d.to + 1) + '番目に移しました');
      }
    }
    wrap.addEventListener('pointerup', finish);
    wrap.addEventListener('pointercancel', finish);
    wrap.addEventListener('touchmove', function (e) { if (drag) e.preventDefault(); }, { passive: false });
    wrap.addEventListener('click', function (e) { if (now() - suppress < 300) { e.stopPropagation(); e.preventDefault(); } }, true);
    wrap.addEventListener('contextmenu', function (e) { if (e.target.closest('.cat-row') && !e.target.closest('input')) e.preventDefault(); });
  }

  // 目標・期限の色は時刻で変わるので、1分ごとに描き直す（選択中のメニューは閉じない）
  setInterval(function () {
    if (document.hidden || ui.app !== 'time') return;
    var a = document.activeElement;
    if (a && a.tagName === 'SELECT' && a.hasAttribute('data-pauseto')) return;
    renderTaskLists();
    if (ui.tab === 'calendar' && ui.calView === 'week') renderWeek(startOfWeek(ui.calDay));
  }, 60000);


  // ===== v1.5：以前の既定カテゴリのままなら、新しい既定（仕事・休憩・家事・運動・趣味・睡眠・入浴）にそろえる =====
  (function migrateDefaultCats() {
    var KEY = 'labelwatch.catsv2';
    try { if (localStorage.getItem(KEY)) return; localStorage.setItem(KEY, '1'); } catch (e) { return; }
    var OLD = ['仕事', '勉強', '家事', '運動', '趣味'], names = data.categories.map(function (c) { return c.name; });
    if (names.length !== OLD.length || OLD.some(function (n) { return names.indexOf(n) < 0; })) return;
    var by = {}; data.categories.forEach(function (c) { by[c.name] = c; });
    var study = by['勉強'], sid = study.id;
    var used = data.sessions.some(function (x) { return x.categoryId === sid; }) || data.tasks.some(function (t) { return t.categoryId === sid || t.pauseTo === sid; }) ||
      data.events.some(function (e) { return e.categoryId === sid; }) || !!(data.running && data.running.categoryId === sid);
    var list = [by['仕事'], { id: uid(), name: '休憩', color: -1 }, by['家事'], by['運動'], by['趣味'], { id: uid(), name: '睡眠', color: -1 }, { id: uid(), name: '入浴', color: -1 }];
    var want = { '仕事': 0, '休憩': 3, '家事': 2, '運動': 1, '趣味': 4, '睡眠': 6, '入浴': 5 };
    if (used) { // 勉強の記録は残す（最後に置く）。今の色はそのままにして、新しいカテゴリに空いている色を付ける
      list.push(study);
      var taken = new Set(list.filter(function (c) { return c.color >= 0; }).map(function (c) { return c.color; }));
      list.forEach(function (c) { if (c.color < 0) { var w = taken.has(want[c.name]) ? firstFreeColor(taken) : want[c.name]; c.color = w; taken.add(w); } });
    } else list.forEach(function (c) { c.color = want[c.name]; });
    data.categories = list;
    if (!catById(data.selectedCategoryId)) data.selectedCategoryId = list[0].id;
    save();
    setTimeout(function () { toast('カテゴリを新しい並び（仕事・休憩・家事・運動・趣味・睡眠・入浴）にしました。↶で元に戻せます'); }, 700);
  })();


  // ===== v1.6：集計の記録をすべて削除する（カテゴリ・タスク・予定・計測中のものはそのまま。直後なら↶で戻せる） =====
  function wipeRecords() {
    var n = data.sessions.length;
    if (!n) { toast('削除する記録はありません'); return; }
    confirmDialog({ title: '記録をすべて削除しますか？', message: '時間管理の記録 ' + n + ' 件がすべて消えます。カテゴリ・タスク・予定・家計簿と、計測中のものはそのままです。直後なら右上の↶で戻せます。', ok: 'すべて削除する', destructive: true })
      .then(function (ok) {
        if (!ok) return;
        data.sessions = []; ui.lastStopped = null; ui.sel = null;
        save(); renderAll(); toast('記録をすべて削除しました');
      });
  }
  $('#btnWipeRecords').addEventListener('click', wipeRecords);

  // ===== 操作の受け付け =====
  $('#btnStart').addEventListener('click', toggleRun);
  $('#btnDiscard').addEventListener('click', discardRun);
  $('#btnEditCats').addEventListener('click', function () { openCategoryEditor(false); });
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnMenu').addEventListener('click', openMenu);
  $('#calPrev').addEventListener('click', function () { changeMonth(-1); });
  $('#calNext').addEventListener('click', function () { changeMonth(1); });
  $('#calToday').addEventListener('click', function () { ui.calMonth = startOfMonth(now()); ui.calDay = startOfDay(now()); renderCalendar(); });
  $('#calGrid').addEventListener('click', function (e) { var b = e.target.closest('button.day'); if (!b) return; ui.calDay = Number(b.getAttribute('data-day')); renderCalendar(); });
  $('#calSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) setCalView(b.getAttribute('data-view')); });
  $('#calNavPrev').addEventListener('click', function () { calMove(-1); });
  $('#calNavNext').addEventListener('click', function () { calMove(1); });
  $('#calNavToday').addEventListener('click', function () { ui.calDay = startOfDay(now()); ui.calMonth = startOfMonth(ui.calDay); renderCalendar(); });
  $('#calWeek').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-goday')) { ui.calDay = Number(b.getAttribute('data-goday')); ui.calMonth = startOfMonth(ui.calDay); setCalView('day'); return; }
    var day = Number(b.getAttribute('data-day'));
    if (b.hasAttribute('data-event')) openEventEditor(b.getAttribute('data-event'), day);
    else if (b.hasAttribute('data-task')) openTaskEditor(b.getAttribute('data-task'), day);
  });
  $('#btnAddEvent').addEventListener('click', function () { openEventEditor(null, ui.calDay); });
  $('#btnAddTask').addEventListener('click', function () { openTaskEditor(null, ui.calDay); });
  $('#btnSwAddTask').addEventListener('click', function () { openTaskEditor(null, startOfDay(now())); });
  $('#eventList').addEventListener('click', function (e) { var b = e.target.closest('[data-event]'); if (b) openEventEditor(b.getAttribute('data-event'), ui.calDay); });
  ['#taskList', '#overList', '#swTaskList', '#swOverList'].forEach(function (sel) {
    var el = $(sel);
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.hasAttribute('data-done')) { taskDone(b.getAttribute('data-done')); return; }
      var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
      if (act === 'start' || act === 'resume') { taskStart(id); return; }
      if (act === 'pause') { taskPause(id); return; }
      if (b.hasAttribute('data-task')) { var t = taskById(b.getAttribute('data-task')); openTaskEditor(b.getAttribute('data-task'), t ? t.date : ui.calDay); }
    });
    el.addEventListener('change', function (e) {
      var id = e.target.getAttribute('data-pauseto'); if (id) setPauseTo(id, e.target.value);
      var fid = e.target.getAttribute('data-finishto'); if (fid) setFinishTo(fid, e.target.value);
    });
  });
  $('#btnUndo').addEventListener('click', undoLast);
  $('#chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-action') === 'add') { openCategoryEditor(true); return; }
    selectCategory(b.getAttribute('data-id'));
  });
  $$('.tabbar button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
  $('#seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    ui.period = b.dataset.period; ui.anchor = now(); ui.anchorTouched = false; ui.sel = null; ui.recLimit = 50; saveUI(); renderSummary();
  });
  $('#prevP').addEventListener('click', function () { ui.anchor = shiftAnchor(ui.period, ui.anchor, -1); ui.anchorTouched = true; ui.sel = null; ui.recLimit = 50; renderSummary(); });
  $('#nextP').addEventListener('click', function () { ui.anchor = shiftAnchor(ui.period, ui.anchor, 1); ui.anchorTouched = true; ui.sel = null; ui.recLimit = 50; renderSummary(); });
  function toggleSel(id) { ui.sel = ui.sel === id ? null : id; renderSummary(); }
  $('#pie').addEventListener('click', function (e) { var id = e.target.getAttribute && e.target.getAttribute('data-id'); if (id) toggleSel(id); });
  $('#legend').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) toggleSel(b.getAttribute('data-id')); });
  $('#records').addEventListener('click', function (e) { var b = e.target.closest('button.rec'); if (b) openRecordEditor(b.getAttribute('data-id')); });
  $('#btnAddRecord').addEventListener('click', function () { openRecordEditor(null); });
  $('#moreRecords').addEventListener('click', function () { ui.recLimit += 50; renderSummary(); });

  // 画面に戻ってきた時に表示を時刻から作り直す（裏で動かしていないので、ここで追いつく）
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopTicker(); return; }
    var fresh = readJSON(STORAGE_KEY); // 別タブでの変更も反映
    if (fresh) { try { data = normalize(fresh); lastJSON = JSON.stringify(data); } catch (e) {} }
    renderAll(); startTicker();
  });
  window.addEventListener('pageshow', function () { renderAll(); startTicker(); });
  setInterval(function () { // 計測中は集計と今日の合計をときどき更新
    if (document.hidden || !data.running) return;
    if (ui.tab === 'summary') renderSummary(); else renderChips();
  }, 30000);

  // オフラインで使えるように（キャッシュするのはこのアプリ自身のファイルだけ）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  // テスト用に一部の関数を公開（動作には影響しません）
  window.__labelwatch = { periodRange: periodRange, aggregate: aggregate, normalize: normalize, csvText: csvText, exportObject: exportObject,
    get data() { return data; }, get prefs() { return prefs; }, get money() { return money; }, balances: balances, holdings: holdings, valuation: valuation, netFlow: netFlow, fmtClock: fmtClock, fmtDur: fmtDur, eventsOn: eventsOn, tasksOn: tasksOn, taskActual: taskActual, overdueTasks: overdueTasks, taskLevel: taskLevel, taskRunState: taskRunState, pauseTarget: pauseTarget, finishTarget: finishTarget, activeTask: activeTask, runningCumulative: runningCumulative, labelTotalDay: labelTotalDay, labelKey: labelKey, get undoJSON() { return undoJSON; }, normalize: normalize };

  showStorageBanner();
  setTab(ui.tab);
})();
</script>
